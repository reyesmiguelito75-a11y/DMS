<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - DocuFlow</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="login-page">

    <div class="login-container">

        <div class="login-logo">
            <div class="brand-icon">D</div>
            <h2>DocuFlow</h2>
            <p>DOCUMENT MANAGEMENT SYSTEM</p>
        </div>

        <div class="login-box">
            <h1>Welcome Back!</h1>
            <p class="login-description">
                Sign in to access your account.
            </p>

            <div id="login-error" class="login-error" style="display: none;"></div>

            <form action="php/login_process.php" method="POST">

                <div class="login-input">
                    <label for="username">Username</label>
                    <input type="text" id="username"
                           name="username"
                           placeholder="Enter your username"
                           required>
                </div>

                <div class="login-input">
                    <label for="password">Password</label>
                    <input type="password" id="password"
                           name="password"
                           placeholder="Enter your password"
                           required>
                </div>

                <button type="submit" class="login-button">
                    Login
                </button>

            </form>
            <div class="signup-link">
            <p>Don't have an account yet?</p>

            <a href="signup.html" class="signup-page-button">
        Create an Account
    </a>
</div>
        </div>

        <p class="login-footer">
            © 2026 DocuFlow | Document Management System
        </p>

    </div>

    <script>
    const params = new URLSearchParams(window.location.search);
    const error = params.get("error");
    const errorBox = document.getElementById("login-error");

    if (error === "rejected") {
        errorBox.textContent = "This account doesn't exist.";
        errorBox.style.display = "block";
    } else if (error === "pending") {
        errorBox.textContent = "This account is still pending approval.";
        errorBox.style.display = "block";
    } else if (error === "invalid") {
        errorBox.textContent = "Invalid username or password.";
        errorBox.style.display = "block";
    }
    </script>

</body>
</html>
